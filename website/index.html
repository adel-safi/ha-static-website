<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HA Static Website</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.6; }
    code { background: rgba(127,127,127,.15); padding: .1rem .3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Hello from Paris 🇫🇷</h1>
  <p>This page is served by <code>nginx</code> on EC2 in <code>eu-west-3</code>,
     behind an Application Load Balancer, and delivered worldwide by Amazon CloudFront.</p>
  <p>The load balancer only answers requests that come from CloudFront.</p>
</body>
</html>
